<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0F141D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="EGW 閱讀">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>EGW 閱讀與檢索</title>
<style>
<style>
/* ---------- tokens: full light palette on bare :root ---------- */
:root{
  --ground:#FBFBF9; --surface:#FFFFFF; --surface-2:#F3F4F2;
  --ink:#16233A; --muted:#5A6379; --faint:#8A93A5;
  --rule:#DBDDE3; --rule-soft:#EBECF0;
  --brass:#8C6420; --brass-ink:#6B4B16; --brass-soft:#F4E8CE; --brass-line:#DDC58E;
  --sage:#3D5E44; --sage-soft:#E3ECE4;
  --clay:#964734; --clay-soft:#F6E4DF;
  --shadow:0 1px 2px rgba(22,35,58,.05), 0 10px 28px rgba(22,35,58,.06);
  --f-disp:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-scr:"Songti TC","Noto Serif TC","Source Han Serif TC",Georgia,serif;
  --maxw:620px; --fs:1;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F141D; --surface:#161C27; --surface-2:#1C2331;
    --ink:#E6EAF1; --muted:#96A0B4; --faint:#6C7587;
    --rule:#28303E; --rule-soft:#1E2532;
    --brass:#D4A95C; --brass-ink:#E9CE96; --brass-soft:#2C2517; --brass-line:#4A3C22;
    --sage:#8FB897; --sage-soft:#1B2A1F;
    --clay:#DD9484; --clay-soft:#2E1C18;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0F141D; --surface:#161C27; --surface-2:#1C2331;
  --ink:#E6EAF1; --muted:#96A0B4; --faint:#6C7587;
  --rule:#28303E; --rule-soft:#1E2532;
  --brass:#D4A95C; --brass-ink:#E9CE96; --brass-soft:#2C2517; --brass-line:#4A3C22;
  --sage:#8FB897; --sage-soft:#1B2A1F;
  --clay:#DD9484; --clay-soft:#2E1C18;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-ui);
  font-size:calc(16px * var(--fs));line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--rule-soft)}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:54px}
.bar-title{font-weight:600;font-size:16px;letter-spacing:.01em;flex:1 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wordmark{font-family:var(--f-disp);font-size:19px;font-weight:600;letter-spacing:.01em;flex:1 1 auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wordmark i{font-style:normal;font-weight:500;color:var(--brass)}
.wordmark .ed{font-weight:400;font-size:13.5px;color:var(--muted);margin-left:5px;letter-spacing:0}
.back{display:flex;align-items:center;gap:3px;color:var(--brass);font-size:15px;white-space:nowrap;flex:0 0 auto;
  margin-left:-6px;padding:6px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--rule-soft);
  border-radius:9px;padding:2px;gap:2px;flex:0 0 auto}
.seg button{font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.04em;
  padding:5px 8px;border-radius:7px;color:var(--muted);white-space:nowrap;
  border:1px solid transparent}
/* 選中的用銅色填滿，跟旁邊的膠囊按鈕一致，一眼就看得出來選了哪一個 */
.seg button[aria-pressed="true"]{background:var(--brass-soft);color:var(--brass-ink);
  border-color:var(--brass-line);font-weight:600;box-shadow:none}
main{padding:18px 0 calc(104px * var(--fs))}

/* ---------- topic list ---------- */
.search{width:100%;padding:11px 14px;border-radius:11px;border:1px solid var(--rule);
  background:var(--surface);color:var(--ink);font:inherit;font-size:calc(15px * var(--fs));margin-bottom:6px}
.search::placeholder{color:var(--faint)}
/* 聖經全文搜尋：命中的字詞套一下底色，跟其他強調用色（brass）同一套 */
.bqhit{background:var(--brass-soft);color:var(--brass-ink);border-radius:3px;padding:0 1px}
.hint{color:var(--muted);font-size:calc(12.5px * var(--fs));line-height:1.55;margin:10px 2px 16px}
.tlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--rule-soft);
  border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.trow{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%;
  border-bottom:1px solid var(--rule-soft)}
.tlist .trow:last-child{border-bottom:0}
.trow:active{background:var(--surface-2)}
.trow-main{flex:1 1 auto;min-width:0}
.trow-zh{display:block;font-weight:600;font-size:calc(16px * var(--fs));letter-spacing:.01em}
.trow-en{display:block;font-family:var(--f-disp);font-weight:500;
  font-size:calc(12px * var(--fs));letter-spacing:.07em;color:var(--muted);
  margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}
.count{font-family:var(--f-mono);font-size:calc(12px * var(--fs));color:var(--muted);font-variant-numeric:tabular-nums}
.pagebadge{font-family:var(--f-mono);font-size:calc(10.5px * var(--fs));font-weight:600;color:var(--brass-ink);
  background:var(--brass-soft);border:1px solid var(--brass-line);border-radius:5px;
  padding:1px 5px;letter-spacing:.03em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--brass);flex:0 0 auto}
.chev{color:var(--faint);font-size:calc(17px * var(--fs));flex:0 0 auto}

/* ---------- topic detail ---------- */
.thead{margin:2px 0 18px}
.thead h1{font-size:calc(26px * var(--fs));line-height:1.25;margin:0;letter-spacing:.01em;text-wrap:balance}
.thead .en{font-family:var(--f-disp);font-weight:500;font-size:calc(13px * var(--fs));
  color:var(--brass);margin-top:4px;letter-spacing:.1em}
.thead .src{font-family:var(--f-mono);font-size:calc(11px * var(--fs));color:var(--faint);margin-top:8px;letter-spacing:.03em}
.actions{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;
  border-radius:10px;border:1px solid var(--rule);background:var(--surface);font-size:calc(14.5px * var(--fs));
  font-weight:500;box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn-brass{background:var(--brass-soft);color:var(--brass-ink);border-color:var(--brass-line);box-shadow:none}
.btn-wide{flex:1 1 0}
.btn-sage{background:var(--sage-soft);color:var(--sage);border-color:transparent}
.btn-clay{background:var(--clay-soft);color:var(--clay);border-color:transparent}
.btn:disabled{opacity:.4}

.sub{font-family:var(--f-mono);font-size:calc(11.5px * var(--fs));font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--brass);margin:22px 0 8px;padding-bottom:5px;
  border-bottom:1px solid var(--brass-line)}
.sub em{display:block;font-family:var(--f-ui);font-style:normal;font-size:calc(14.5px * var(--fs));font-weight:600;
  letter-spacing:.01em;color:var(--ink);text-transform:none;margin-bottom:3px}
.entry{display:block;width:100%;text-align:left;padding:9px 0;border-bottom:1px solid var(--rule-soft)}
.entry:active{background:var(--surface-2)}
.eline{display:flex;align-items:baseline;gap:0}
.enum{font-family:var(--f-mono);font-size:calc(11px * var(--fs));color:var(--faint);
  flex:0 0 auto;min-width:calc(26px * var(--fs));
  font-variant-numeric:tabular-nums;padding-top:2px}
.etext{font-size:calc(15px * var(--fs));line-height:1.45}
.i1 .etext{padding-left:14px}
.leader{flex:1 1 auto;border-bottom:1px dotted var(--rule);margin:0 6px;transform:translateY(-4px);min-width:10px}
.eref{font-family:var(--f-mono);font-size:calc(12.5px * var(--fs));color:var(--brass-ink);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.eref.blank{color:var(--faint)}
.erefs{display:flex;flex-direction:column;align-items:flex-end;gap:1px;
  padding-left:26px;margin-top:2px}
.een{display:block;font-size:calc(11.5px * var(--fs));color:var(--faint);padding-left:26px;margin-top:1px;line-height:1.4}

/* ---------- drill card ---------- */
.prog{height:4px;background:var(--rule-soft);border-radius:99px;overflow:hidden;margin:0 0 14px}
.prog i{display:block;height:100%;background:var(--brass);border-radius:99px;transition:width .25s ease}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.stepback{font-family:var(--f-mono);font-size:calc(12px * var(--fs));color:var(--brass);
  padding:2px 0;letter-spacing:.03em}
.qmeta .n{font-family:var(--f-mono);font-size:calc(12px * var(--fs));color:var(--muted);letter-spacing:.04em;
  font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--rule-soft);border-radius:16px;
  padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card .ctx{font-family:var(--f-mono);font-size:calc(10.5px * var(--fs));letter-spacing:.1em;text-transform:uppercase;
  color:var(--brass)}
.card .qtext{font-size:calc(19px * var(--fs));line-height:1.5;letter-spacing:.01em;text-wrap:balance}
.card .qen{font-size:calc(12.5px * var(--fs));color:var(--faint);line-height:1.45}
.card hr{border:0;border-top:1px solid var(--rule-soft);margin:0}
.answer{font-family:var(--f-mono);font-size:calc(17px * var(--fs));color:var(--brass-ink);letter-spacing:.02em;
  font-variant-numeric:tabular-nums;word-break:break-word}
.rseg{display:inline-block;padding:1px 4px 3px;border-radius:4px}
.rseg.hid{color:var(--faint);cursor:pointer;border-bottom:1.5px dashed var(--brass-line)}
.rseg.hid:active{background:var(--brass-soft)}
.rsep{color:var(--faint);padding:0 1px}
.rline{display:block;height:2px}
.answer .rseg{display:inline-block}
.taprow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px}
.taprow .h{font-family:var(--f-mono);font-size:calc(10.5px * var(--fs));color:var(--brass);
  letter-spacing:.05em}
.rchips{display:flex;align-items:center;gap:4px;margin-left:auto}
.rchips .lbl{font-family:var(--f-mono);font-size:calc(10px * var(--fs));color:var(--faint);
  letter-spacing:.08em}
.rchips button{font-family:var(--f-mono);font-size:calc(10px * var(--fs));padding:4px 8px;
  border-radius:99px;border:1px solid var(--rule-soft);color:var(--muted);background:var(--surface)}
.rchips button[aria-pressed="true"]{background:var(--brass-soft);color:var(--brass-ink);
  border-color:var(--brass-line);font-weight:600}
.qtext.tap,.vbody.tap{cursor:pointer;border-radius:8px}
.qtext.tap:active,.vbody.tap:active{background:var(--brass-soft)}
.taphint{font-family:var(--f-mono);font-size:calc(10.5px * var(--fs));color:var(--brass);
  letter-spacing:.05em;margin-top:-6px}
.rbk{font-size:.72em;color:var(--faint);letter-spacing:0}
.spacer{flex:1 1 auto}
.footbar{position:fixed;left:0;right:0;bottom:0;z-index:39;
  background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--rule-soft);padding:10px 0 max(10px,env(safe-area-inset-bottom))}
.footbar .wrap{display:flex;gap:8px}

/* ---------- 聖經瀏覽：書卷／章／節的格子 ---------- */
.bgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;
  background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.bcell{padding:15px 3px;font-size:calc(14px * var(--fs));line-height:1.25;
  color:#EAE6DF;background:var(--surface-2);text-align:center;word-break:break-all}
.bcell.num{font-family:var(--f-mono);font-size:calc(14.5px * var(--fs));padding:17px 3px}
.bcell:active{filter:brightness(1.25)}
.bcell.on{outline:2px solid var(--brass);outline-offset:-2px;filter:brightness(1.35)}
.bcell.law{background:#7C7A46}  .bcell.hist{background:#4A6B7C}
.bcell.poet{background:#7C5A46} .bcell.maj{background:#4E7C55}
.bcell.min{background:#8A5257}  .bcell.gos{background:#6E7C46}
.bcell.acts{background:#46707C} .bcell.epi{background:#4E7C63}
.bcell.rev{background:#8A5257}
.badded{background:var(--brass-soft);border:1px solid var(--brass-line);color:var(--brass-ink);
  border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:calc(13.5px * var(--fs))}

/* ---------- 前後文（整章） ---------- */
/* ---- bottom tabs ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:6px;
  background:var(--surface);border-top:1px solid var(--rule);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;padding:9px 4px;font-size:calc(13.5px * var(--fs));
  color:var(--muted);font-weight:500;letter-spacing:.02em;
  border:1px solid var(--brass-line);border-radius:10px;background:transparent;
  transition:background .15s,border-color .15s,color .15s}
.tabbar button[aria-current="true"]{color:var(--brass-ink);font-weight:600;
  background:var(--brass-soft);border-color:var(--brass)}
body.hastab main{padding-bottom:102px}
body.hastab .footbar{bottom:calc(54px + env(safe-area-inset-bottom))}
body.hastab.hasfoot main{padding-bottom:174px}
/* ---- 英文朗讀（KJV）常駐播放器：疊在分頁列上方，跟 footbar 同一層邏輯 ----
   刻意跟分頁列之間留 8px 間隙（bottom 多加 8px、並用圓角+陰影跟下面的分頁列
   區隔開），避免播放器貼著或蓋到 Bible/Topics/Memorize/Settings 四個按鈕的上緣 */
.audiobar{position:fixed;left:0;right:0;z-index:41;
  bottom:calc(54px + env(safe-area-inset-bottom) + 8px);
  background:var(--surface);
  border:1px solid var(--brass-line);border-radius:14px;
  box-shadow:0 4px 14px rgba(0,0,0,.22);
  margin:0 8px;padding:8px 12px}
.audiobar .wrap{display:flex;flex-direction:column;gap:4px}
.audiotop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.audiolabel{font-size:calc(13px * var(--fs));color:var(--brass-ink);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:70vw}
.audioscrub{display:flex;align-items:center;gap:8px}
.audiotime{font-size:calc(11px * var(--fs));color:var(--muted);min-width:34px;text-align:center;
  font-variant-numeric:tabular-nums}
.audioseek{flex:1 1 auto;min-width:0;height:20px;accent-color:var(--brass)}
.audiobtns{display:flex;align-items:center;justify-content:center;gap:10px}
.aud-btn{display:flex;align-items:center;justify-content:center;background:transparent;
  border:none;color:var(--brass-ink);padding:4px;cursor:pointer}
.aud-btn[disabled]{color:var(--muted);opacity:.35;cursor:default}
.aud-side{width:34px;height:34px}
.aud-play{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--brass-line);
  background:var(--brass-soft)}
.aud-stop{width:26px;height:26px;color:var(--muted)}
body.hasaudio.hastab main{padding-bottom:230px}
body.hasaudio.hastab.hasfoot main{padding-bottom:302px}
body.hasaudio.hastab .footbar{bottom:calc(182px + env(safe-area-inset-bottom))}
.fab{position:fixed;right:20px;z-index:41;width:54px;height:54px;border-radius:50%;
  bottom:calc(74px + env(safe-area-inset-bottom));
  background:var(--brass);color:var(--ground);font-size:26px;line-height:1;font-weight:400;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.fab:active{opacity:.85}
.libempty{text-align:center;padding:70px 10px;color:var(--muted)}
.libempty p{margin:0;font-size:calc(16px * var(--fs))}
.libempty .sub{margin-top:10px;font-size:calc(13.5px * var(--fs));color:var(--faint)}
.lrow{display:flex;align-items:center;gap:12px}
.lmain{flex:1 1 auto;min-width:0}
.ltitle{display:block;font-size:calc(15.5px * var(--fs));line-height:1.4}
.plan{background:var(--surface);border:1px solid var(--rule);border-radius:12px;
  padding:14px 16px;margin:2px 0 12px}
.prow1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:calc(14px * var(--fs))}
.prow1 .n{font-family:var(--f-mono);font-size:calc(11.5px * var(--fs));color:var(--muted)}
.pbar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brass);border-radius:3px}
/* ---- topic picker ---- */
.prow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:12px 0;border-bottom:1px solid var(--rule-soft)}
.prow .ck{width:21px;height:21px;border-radius:50%;flex:0 0 auto;border:1.5px solid var(--rule);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent}
.prow[aria-pressed="true"] .ck{background:var(--brass);border-color:var(--brass);color:var(--ground)}
.prow.dim{opacity:.4}
.prow .ck.ckopen{border:0;background:none;color:var(--brass);font-size:calc(19px * var(--fs))}
.prow .pt{flex:1 1 auto;min-width:0}
/* 背誦庫清單「刪除主題」勾選模式：借用跟選主題畫面一樣的圓形勾選外觀 */
.lrow .ck{width:21px;height:21px;border-radius:50%;flex:0 0 auto;border:1.5px solid var(--rule);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent}
.lrow[aria-pressed="true"] .ck{background:var(--brass);border-color:var(--brass);color:var(--ground)}
.prow .pn{display:block;font-family:var(--f-mono);font-size:calc(11px * var(--fs));
  color:var(--faint);margin-top:2px}
/* ---- settings ---- */
.scard{background:var(--surface);border:1px solid var(--rule);border-radius:12px;
  padding:16px;margin-bottom:6px;font-size:calc(14px * var(--fs));line-height:1.65;color:var(--muted)}
.scard p{margin:0}
.slab{font-family:var(--f-mono);font-size:calc(11px * var(--fs));letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.dchips{display:flex;flex-wrap:wrap;gap:7px}
.dchip{font-family:var(--f-mono);font-size:calc(12px * var(--fs));padding:7px 13px;
  border:1px solid var(--rule);border-radius:8px;color:var(--muted)}
.dchip[aria-pressed="true"]{background:var(--brass-soft);color:var(--brass-ink);
  border-color:var(--brass-line);font-weight:600}
.dcustom{display:flex;gap:8px;margin-top:12px;align-items:center}
.dnum{width:92px;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;
  background:var(--surface-2);color:var(--ink);font-family:var(--f-mono);
  font-size:calc(13px * var(--fs));-webkit-appearance:none}
.note2{margin-top:12px !important;font-size:calc(12px * var(--fs));color:var(--faint);line-height:1.6}
.stat2{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule);
  font-size:calc(14.5px * var(--fs));color:var(--brass-ink)}
.steps{margin:8px 0 0;padding-left:0;list-style:none}
.steps li{margin-top:7px;font-size:calc(13.5px * var(--fs));line-height:1.6}
/* ---- 順序背誦：整頁清單 ---- */
.sprog{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-family:var(--f-mono);font-size:calc(11.5px * var(--fs));color:var(--muted);
  padding:4px 0 10px;margin-bottom:4px;border-bottom:1px solid var(--rule)}
.sprog .n{color:var(--faint)}
.srow{border-bottom:1px solid var(--rule-soft);padding:4px 0 8px}
.sline{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:10px 0 4px}
.srow .sblk{border-bottom:1.5px dashed var(--brass-line);padding:0 2px 1px}
.srow .sblk.on{border-bottom-color:transparent}
.sline .vstate{margin-top:7px;flex:0 0 auto}
.skey{flex:0 0 auto;max-width:44%;font-family:var(--f-mono);
  font-size:calc(13.5px * var(--fs));color:var(--brass);line-height:1.5;
  font-variant-numeric:tabular-nums;word-break:break-word}
.rseg2{display:inline-block}
.rseg2.hid{color:var(--faint);border-bottom:1.5px dashed var(--brass-line);
  padding-bottom:1px;cursor:pointer;user-select:none}
.rseg2.hid:active{background:var(--brass-soft);border-radius:3px}
.srow .blk{vertical-align:baseline}
.stext{flex:1 1 auto;min-width:0;font-size:calc(14.5px * var(--fs));line-height:1.5}
.stext .sn{display:block;font-family:var(--f-mono);font-size:calc(11px * var(--fs));
  color:var(--faint);margin-top:3px}
.smark{display:flex;gap:7px;padding:2px 0 6px 30px}
.smark button{font-size:calc(12px * var(--fs));padding:5px 14px;border-radius:7px;
  border:1px solid var(--rule);color:var(--muted)}
.smark button:first-child{color:var(--clay);border-color:var(--clay-soft)}
.smark button:last-child{color:var(--sage);border-color:var(--sage-soft)}
.sall{margin-left:auto}
.egrow{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px;padding-left:26px}
.egchip{font-family:var(--f-mono);font-size:calc(10.5px * var(--fs));letter-spacing:.04em;
  color:var(--brass-ink);background:var(--brass-soft);border:1px solid var(--brass-line);
  border-radius:6px;padding:4px 9px;white-space:nowrap}
.egchip:active{opacity:.7}
.egpara{padding:12px 14px;margin:0 -14px 6px;border-radius:10px;color:var(--faint)}
.egpara p{margin:0}
.egref{font-family:var(--f-mono);font-size:calc(10px * var(--fs));letter-spacing:.05em;
  color:var(--faint);margin-bottom:5px}
.egpara.core .egref{color:var(--brass)}
.egopen{margin-left:8px;font-size:11.5px;color:var(--brass);text-decoration:none;white-space:nowrap}
.egzh{font-size:calc(16px * var(--fs));line-height:1.8}
.egen{font-size:calc(15px * var(--fs));line-height:1.65}
.egen.alt{font-size:calc(13px * var(--fs));line-height:1.55;margin-top:9px;color:var(--faint)}
.egpara.core{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--brass);color:var(--ink)}
.egpara.core .egen.alt{color:var(--muted)}
/* 注釋逐段顯示，段落間空一行；引文那一段用粗體跟後面的逐詞解釋分開 */
.cmquote,.cmp{font-size:calc(15px * var(--fs));line-height:1.7;margin:0 0 16px}
.cmquote:last-child,.cmp:last-child{margin-bottom:0}
.cmquote{font-weight:600}
.egnote{font-family:var(--f-mono);font-size:calc(10.5px * var(--fs));line-height:1.7;
  color:var(--faint);margin:16px 0 0;padding-top:12px;border-top:1px solid var(--rule)}
.chline{display:flex;gap:10px;align-items:baseline;padding:7px 8px;border-radius:8px}
.chline.cur{background:var(--brass-soft)}
.chn{font-family:var(--f-mono);font-size:calc(11px * var(--fs));color:var(--faint);
  flex:0 0 auto;min-width:calc(22px * var(--fs));text-align:right;font-variant-numeric:tabular-nums;
  padding-top:.25em}
.chline.cur .chn{color:var(--brass-ink);font-weight:600}
.chtext{font-family:var(--f-scr);font-size:calc(17px * var(--fs));line-height:1.85;flex:1 1 auto;min-width:0}
.chtext.en{font-family:var(--f-ui);font-size:calc(15.5px * var(--fs));line-height:1.75}
.chnav{display:flex;gap:8px;margin:20px 0 0}
.chload{text-align:center;color:var(--muted);font-family:var(--f-mono);
  font-size:calc(12px * var(--fs));padding:40px 0;letter-spacing:.06em}

/* ---------- meditation ---------- */
.refchip.medchip{color:var(--sage);border-color:var(--sage-soft);background:var(--sage-soft)}
.medgoal{font-family:var(--f-ui);font-size:calc(14px * var(--fs));line-height:1.7;color:var(--ink);
  background:var(--surface-2);border-radius:12px;padding:14px 16px;margin:0 0 18px}
.medq{margin:0 0 18px}
.medqn{font-family:var(--f-mono);font-size:calc(11px * var(--fs));color:var(--brass-ink);
  letter-spacing:.04em;margin-right:4px}
.medqtext{font-family:var(--f-ui);font-size:calc(14.5px * var(--fs));line-height:1.65;
  color:var(--ink);margin:0 0 8px}
.medta{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--rule);
  background:var(--surface);color:var(--ink);font:inherit;font-size:calc(14px * var(--fs));
  line-height:1.6;resize:vertical;min-height:calc(64px * var(--fs))}
.medta::placeholder{color:var(--faint)}
.medpr{border-top:1px solid var(--rule);padding-top:18px;margin-top:4px}


/* ---------- verse ---------- */
.vrow{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:11px 0;
  border-bottom:1px solid var(--rule-soft)}
/* 自訂主題底下的管理列：文字本身可點進去背，旁邊另外放排序／移除的小按鈕 */
.ctmrow{align-items:center}
.vmain{display:flex;align-items:flex-start;gap:10px;flex:1 1 auto;min-width:0;text-align:left}
.ctbtns{display:flex;gap:4px;flex:0 0 auto}
.ctmini{width:28px;height:28px;border-radius:8px;background:var(--surface-2);
  border:1px solid var(--rule-soft);color:var(--muted);font-size:14px;line-height:1;
  display:flex;align-items:center;justify-content:center}
.ctmini.ph{visibility:hidden}
.ctmini.ctdel{color:var(--clay);font-size:17px}
/* 經文列表：左欄放章節號＋參考資料小標籤（直排），右欄放經文，經文才有全寬可以橫排 */
.vrow.refrow{align-items:flex-start}
.refrow .vleft{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.refrow .vleft .vmain{flex:0 0 auto;display:flex;align-items:baseline;gap:8px;padding:0}
.refrow .vtextbtn{flex:1 1 auto;min-width:0;text-align:left;padding:0}
.refchip{font-family:var(--f-ui);font-size:calc(11px * var(--fs));font-weight:500;
  padding:5px 10px;border-radius:99px;border:1px solid var(--brass-line);
  background:var(--brass-soft);color:var(--brass-ink);white-space:nowrap;line-height:1.3}
.ctrename{font-family:var(--f-mono);font-size:calc(11px * var(--fs));letter-spacing:.05em;
  color:var(--muted);border:1px solid var(--rule-soft);background:var(--surface);
  border-radius:99px;padding:4px 12px;margin-top:8px}
.vkey{font-family:var(--f-mono);font-size:calc(13.5px * var(--fs));color:var(--brass-ink);flex:0 0 auto;min-width:calc(66px * var(--fs));
  font-variant-numeric:tabular-nums;line-height:1.5;padding-top:1px}
.vtext{font-family:var(--f-scr);font-size:calc(15px * var(--fs));line-height:1.6;flex:1 1 auto;min-width:0}
/* 主題明細列表的標題／節數：原本用行內 style 寫死 px，不會跟著系統字體大小（AA）調整，
   改成共用的 class，套用 --fs 縮放 */
.vtitle{font-family:var(--f-ui);font-size:calc(14px * var(--fs))}
.vsub{color:var(--faint);font-size:calc(11.5px * var(--fs));font-family:var(--f-mono)}
.vbody{font-family:var(--f-scr);font-size:calc(20px * var(--fs));line-height:1.95;letter-spacing:.01em}
.vbody.en{line-height:1.7;letter-spacing:0}

/* ---------- highlight markup ---------- */
.hl{cursor:pointer;border-radius:3px;position:relative;transition:opacity .2s}
.hl-yellow{background:rgba(255,193,7,.4)}
.hl-orange{background:rgba(255,152,0,.4)}
.hl-red{background:rgba(244,67,54,.4)}
@media (prefers-color-scheme:dark){
  .hl-yellow{background:rgba(255,193,7,.2)}
  .hl-orange{background:rgba(255,152,0,.25)}
  .hl-red{background:rgba(244,67,54,.25)}
}
.hl:active{opacity:.7}

/* highlight toolbar */
.hl-toolbar{position:fixed;z-index:50;user-select:none;-webkit-user-select:none;background:var(--surface);border:1px solid var(--rule);
  border-radius:12px;box-shadow:var(--shadow);display:flex;gap:8px;padding:10px;
  max-width:280px}
.hl-toolbar button{padding:8px 12px;border-radius:8px;border:1px solid var(--rule-soft);
  font-size:calc(13px * var(--fs));font-weight:500;white-space:nowrap}
.hl-toolbar button:active{background:var(--surface-2)}
.hl-toolbar .hl-menu{display:flex;gap:6px;align-items:center}
.hl-color-btn{width:32px;height:32px;border-radius:6px;border:2px solid transparent;padding:0}
.hl-color-btn.hl-yellow{background:rgba(255,193,7,.6)}
.hl-color-btn.hl-orange{background:rgba(255,152,0,.6)}
.hl-color-btn.hl-red{background:rgba(244,67,54,.6)}
.hl-toolbar .hl-del{color:var(--clay);flex-shrink:0;font-weight:600;white-space:nowrap;
  border-color:var(--clay);background:var(--clay-soft)}
.hlhint{margin-top:6px}
/* 交叉參照：看起來像一列可以點進去的東西，不要像條目 */
.xref{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:11px 14px;margin:2px 0 10px;border-radius:11px;
  background:var(--surface-2);border:1px solid var(--rule-soft);
  color:var(--brass-ink);font-size:calc(15px * var(--fs))}
.xref:active{background:var(--surface)}
.xref .chev{margin-left:auto;color:var(--brass)}
.xref .xen,.tnote .xen{display:block;font-family:var(--f-disp);font-weight:500;
  font-size:calc(11.5px * var(--fs));letter-spacing:.06em;color:var(--muted);margin-top:2px}
.tnote{padding:2px 2px 12px;color:var(--muted);font-size:calc(13.5px * var(--fs));line-height:1.6}
.blk{display:inline-block;background:var(--brass-soft);border-bottom:1.5px solid var(--brass-line);
  border-radius:3px;color:transparent;margin:0 1px;cursor:pointer;user-select:none}
.blk.on{background:transparent;border-bottom-color:var(--brass);color:var(--brass-ink)}
.sblk{cursor:pointer;user-select:none;border-radius:4px;padding:0 1px}
.sblk:active{background:var(--brass-soft)}
.sblk.on{color:var(--brass-ink)}
.stat{display:flex;gap:14px;margin-top:14px}
.stat div{font-family:var(--f-mono);font-size:calc(11.5px * var(--fs));color:var(--muted);letter-spacing:.04em}
.stat b{color:var(--ink)}
.note{background:var(--surface-2);border:1px solid var(--rule-soft);border-radius:12px;
  padding:13px 14px;color:var(--muted);font-size:calc(13px * var(--fs));line-height:1.6}
.done{text-align:center;padding:34px 10px}
.done .big{font-family:var(--f-mono);font-weight:600;font-size:calc(38px * var(--fs));
  color:var(--brass);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.done p{color:var(--muted);font-size:calc(14px * var(--fs));margin:12px 0 22px}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--rule-soft);
  color:var(--faint);font-size:calc(11.5px * var(--fs));line-height:1.7}

/* ---------- filter row + item state ---------- */
.filt{display:flex;align-items:center;gap:4px;margin:0 0 12px}
.filt button{font-family:var(--f-mono);font-size:calc(11.5px * var(--fs));letter-spacing:.04em;
  padding:5px 10px;border-radius:99px;color:var(--muted);border:1px solid var(--rule-soft);
  background:var(--surface)}
.filt button[aria-pressed="true"]{background:var(--brass-soft);color:var(--brass-ink);
  border-color:var(--brass-line);font-weight:600}
.vstate{width:8px;height:8px;border-radius:50%;flex:0 0 auto;margin-top:.45em}
.vstate.solid{background:var(--sage)}
.vstate.weak{background:var(--clay)}
.vstate.new{background:transparent;box-shadow:inset 0 0 0 1.5px var(--rule)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:0 2px 14px}
.legend span{display:flex;align-items:center;gap:5px;font-family:var(--f-mono);
  font-size:calc(10.5px * var(--fs));color:var(--faint)}
.legend .vstate{margin-top:0}
.clearbtn{display:block;margin:26px auto 0;font-size:calc(12.5px * var(--fs));color:var(--faint);
  padding:8px 12px;border-radius:8px}
.clearbtn.armed{color:var(--clay);background:var(--clay-soft);font-weight:600}

/* ---------- type-size control ---------- */
.abtn{display:flex;align-items:baseline;gap:1px;padding:6px 8px;border-radius:8px;
  border:1px solid var(--rule-soft);background:var(--surface-2);color:var(--muted);flex:0 0 auto}
.abtn[aria-expanded="true"]{background:var(--brass-soft);border-color:var(--brass-line);color:var(--brass-ink)}
.abtn .s{font-family:var(--f-disp);font-size:12px;line-height:1}
.abtn .l{font-family:var(--f-disp);font-size:17px;line-height:1}
.fspanel{background:var(--surface);border:1px solid var(--rule-soft);border-radius:14px;
  padding:16px;box-shadow:var(--shadow);margin-bottom:18px}
.fspanel h2{font-size:calc(13px * var(--fs));margin:0 0 12px;letter-spacing:.02em}
.fsrow{display:flex;align-items:center;gap:10px}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--rule);border-radius:10px;
  overflow:hidden;flex:0 0 auto}
.stepper button{width:46px;height:40px;font-size:20px;line-height:1;color:var(--brass-ink);
  background:var(--surface)}
.stepper button:disabled{color:var(--faint);opacity:.5}
.stepper button:active:not(:disabled){background:var(--brass-soft)}
.stepper span{width:1px;height:24px;background:var(--rule)}
.fsname{font-family:var(--f-mono);font-size:calc(12px * var(--fs));color:var(--muted);
  letter-spacing:.06em;flex:1 1 auto}
.fsname b{color:var(--ink);font-weight:600}
.fssample{margin-top:14px;padding-top:13px;border-top:1px solid var(--rule-soft)}
.fssample .k{font-family:var(--f-mono);font-size:calc(11px * var(--fs));color:var(--brass-ink);
  margin-bottom:3px}
.fssample .v{font-family:var(--f-scr);font-size:calc(20px * var(--fs));line-height:1.95}
.fsreset{margin-top:12px;font-size:calc(12.5px * var(--fs));color:var(--brass-ink);
  text-decoration:underline;text-decoration-color:var(--brass-line);text-underline-offset:2px}

/* ---------- 聖經頁：SDA聖經註釋底部面板 ---------- */
.chn.hascm{position:relative;color:var(--brass-ink);font-weight:600;cursor:pointer;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.chn.hascm::before{content:"";position:absolute;left:-8px;right:-6px;top:-10px;bottom:-10px}
.chn.hascm::after{content:"";position:absolute;left:50%;bottom:-3px;width:4px;height:4px;margin-left:-2px;
  border-radius:50%;background:var(--brass)}
.chline.cmr{box-shadow:inset 2px 0 0 var(--brass-line)}
.chline.cmact{background:var(--brass-soft)}
p.cmp b{color:var(--brass-ink);font-weight:700}
.cmx{color:var(--sage);border-bottom:1px dotted var(--sage);cursor:pointer;padding:3px 0;margin:-3px 0;-webkit-tap-highlight-color:transparent}
.cmx.xc{border-bottom-style:solid}
.cmx:active{background:var(--sage-soft)}
.egwlk{color:var(--brass);text-decoration:none;border-bottom:1px dotted var(--brass);padding:3px 0;margin:-3px 0}
.egwlk:active{opacity:.6}
.cmback{display:inline-flex;align-items:center;gap:4px;margin:0 0 12px;padding:6px 12px;border-radius:999px;border:1px solid var(--brass-line);background:transparent;color:var(--brass-ink);font-size:calc(13px * var(--fs))}
#cmref{position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;flex-direction:column;max-height:60vh;
  background:var(--surface);border-top:2px solid var(--brass);border-radius:16px 16px 0 0;
  box-shadow:0 -8px 28px rgba(0,0,0,.45);padding-bottom:env(safe-area-inset-bottom)}
#cmref.open{display:flex}
.cmrhead{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:12px 12px 8px;border-bottom:1px solid var(--rule-soft)}
.cmrtitle{flex:1 1 auto;min-width:0;font-size:calc(14px * var(--fs));color:var(--brass-ink);font-weight:600}
.cmrbody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 4px}
.cmrv{margin:0 0 10px;line-height:1.75;font-size:calc(16px * var(--fs));color:var(--ink)}
.cmrv b{color:var(--brass-ink);font-weight:600;margin-right:6px;font-size:.8em}
.cmracts{flex:0 0 auto;display:flex;gap:8px;padding:8px 12px 12px}
.cmracts .btn{flex:1 1 0;margin:0}
#cmsheet{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;flex-direction:column;
  height:56vh;max-height:56vh;background:var(--surface);border-top:1px solid var(--brass-line);
  border-radius:16px 16px 0 0;box-shadow:0 -6px 22px rgba(0,0,0,.30);
  padding-bottom:env(safe-area-inset-bottom);transition:transform .2s ease-out}
#cmsheet.open{display:flex}
#cmsheet.full{height:calc(100vh - 52px);max-height:none}
@supports (height:100dvh){#cmsheet{height:56dvh;max-height:56dvh}#cmsheet.full{height:calc(100dvh - 52px);max-height:none}}
.cmgrip{flex:0 0 auto;padding:8px 12px 8px;touch-action:none;border-bottom:1px solid var(--rule-soft)}
.cmgrip-bar{width:38px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 8px}
.cmhead{display:flex;align-items:center;gap:6px}
.cmtitle{flex:1 1 auto;min-width:0;font-size:calc(14px * var(--fs));color:var(--brass-ink);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmbtn{flex:0 0 auto;width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  border-radius:10px;border:1px solid var(--brass-line);background:transparent;color:var(--brass-ink);padding:0}
.cmbtn[disabled]{opacity:.3}
.cmsbody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 20px}
#cmsheet .egpara,#cmsheet .egpara.core{margin:0;padding:0;background:none;box-shadow:none;color:var(--ink)}
#cmsheet .egpara p.cmp{margin:0 0 12px}
#cmsheet .egpara p.cmquote{margin:0 0 14px;padding:0 0 12px;border-bottom:1px solid var(--rule-soft);font-weight:500;color:var(--muted)}
body.hascmsheet main,body.hascmsheet.hasaudio.hastab main,body.hascmsheet.hasaudio.hastab.hasfoot main{padding-bottom:62vh}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- EGW-specific ---------- */
:root{--f-en:Georgia,"Iowan Old Style","Times New Roman",serif;--f-zh:"Songti TC","Noto Serif TC","Source Han Serif TC","PMingLiU",Georgia,serif}
a{color:var(--brass-ink)}
.bar-title small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:-2px;overflow:hidden;text-overflow:ellipsis}
.search{margin-bottom:6px}
.resume{display:block;width:100%;text-align:left;background:var(--brass-soft);border:1px solid var(--brass-line);border-radius:14px;padding:12px 14px;margin:6px 0 10px}
.resume b{display:block;color:var(--brass-ink);font-size:calc(11.5px * var(--fs));letter-spacing:.08em;margin-bottom:2px;font-family:var(--f-mono)}
.resume span{display:block;font-size:calc(15px * var(--fs));font-weight:600}
.resume small{display:block;color:var(--muted);font-size:calc(12px * var(--fs));margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xref{margin:0 0 10px;padding:11px 14px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--rule);background:var(--surface);font-size:calc(13px * var(--fs));color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brass-soft);border-color:var(--brass-line);color:var(--brass-ink);font-weight:600}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--rule-soft);flex-wrap:wrap}
.tlist .setrow:last-child{border-bottom:0}
.setrow label{font-size:calc(14.5px * var(--fs))}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:calc(14px * var(--fs))}
.fsopt{margin-top:12px}.fsopt .k{font-size:calc(12px * var(--fs));color:var(--muted);margin-bottom:5px}
.bsf{margin:0 0 4px}
.tocpart{font-size:calc(12px * var(--fs));letter-spacing:.06em;color:var(--brass-ink);font-weight:700;padding:10px 14px 6px;background:var(--surface-2);border-bottom:1px solid var(--rule-soft)}
/* reader */
.rhead{margin:4px 0 10px}
.rhead h1{font-family:var(--f-en);font-size:calc(24px * var(--fs));line-height:1.25;margin:0}
.rhead h1.zh{font-family:var(--f-zh)}
.rhead .zh2{font-family:var(--f-zh);font-size:calc(18px * var(--fs));color:var(--muted);margin-top:4px}
.sub3{font-family:var(--f-en);font-size:calc(17px * var(--fs));font-weight:700;margin:22px 0 6px;color:var(--ink)}
.sub3 .zh2{font-family:var(--f-zh);font-weight:600;font-size:calc(16px * var(--fs));color:var(--muted);display:block;margin-top:2px}
.hpart{font-size:calc(13px * var(--fs));letter-spacing:.07em;color:var(--brass-ink);font-weight:700;margin:26px 0 4px}
.hpart .zh2{display:block;font-family:var(--f-zh);letter-spacing:0;font-weight:600;color:var(--muted);margin-top:2px}
.para{position:relative;padding:8px 0 10px}
.para.sel{background:var(--brass-soft);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:10px}
.para.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,40%{background:var(--brass-soft)}100%{background:transparent}}
.ref{display:inline-block;font-family:var(--f-mono);font-size:calc(10.5px * var(--fs));color:var(--faint);letter-spacing:.03em;margin-bottom:2px}
.ref.bm{color:var(--brass)}
p.en,blockquote.en{font-family:var(--f-en);font-size:calc(17px * var(--fs));line-height:1.62;margin:0 0 6px}
p.en b{font-weight:700}
p.zh{font-family:var(--f-zh);font-size:calc(17px * var(--fs));line-height:1.78;margin:0 0 6px}
.alt{color:var(--muted);font-size:calc(15px * var(--fs))!important}
blockquote.en{margin:0 0 6px 14px;padding-left:12px;border-left:2px solid var(--brass-line);font-style:italic}
.nav2{display:flex;gap:10px;margin:28px 0 8px}
.nav2 .btn{flex:1 1 0}
.sheet{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:38;background:var(--surface);border-top:1px solid var(--rule);
  box-shadow:0 -10px 30px rgba(0,0,0,.25);padding:12px 16px 14px;
  transform:translateY(calc(100% + 90px));visibility:hidden;transition:transform .18s ease-out,visibility 0s .18s;max-height:60vh;overflow:auto}
.sheet.on{transform:none;visibility:visible;transition:transform .18s ease-out}
.sheet .wrap{padding:0}
.sheet h4{margin:0 0 8px;font-size:calc(13px * var(--fs));font-family:var(--f-mono);color:var(--brass-ink);font-weight:600}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sheet .acts .btn{padding:8px 12px;font-size:calc(14px * var(--fs))}
.sheet .k2{font-size:calc(12px * var(--fs));color:var(--muted);margin:10px 0 6px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--ground);
  padding:8px 14px;border-radius:99px;font-size:13.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.toast.on{opacity:.95}
.hit-h{display:flex;gap:8px;align-items:center;margin-bottom:3px}
.hit-s{display:block;font-size:calc(14.5px * var(--fs));line-height:1.55;color:var(--ink);white-space:normal}
.hit-s.z{font-family:var(--f-zh)}
mark{background:var(--brass-soft);color:var(--brass-ink);border-radius:3px;padding:0 1px}

.actions.drill .btn{flex:1 1 calc(50% - 4px);white-space:nowrap}

.aitag{display:inline-block;font-size:calc(10px * var(--fs));color:var(--faint);border:1px solid var(--faint);border-radius:4px;padding:0 4px;margin:0 6px 2px 0;line-height:1.5;opacity:.8}

.sgroup{margin-bottom:14px}
.ghead{display:flex;gap:8px;align-items:center;padding:4px 2px 6px}
.ghead b{flex:1 1 auto;min-width:0;font-size:calc(15px * var(--fs))}
.gmore{display:block;width:100%;margin-top:6px;padding:9px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--brass-ink);font-size:calc(13.5px * var(--fs))}

.bsort{margin:2px 0 12px}
.bsort .seg{width:100%}.bsort .seg button{flex:1}
.gtog{display:flex;align-items:center;width:100%;padding:8px 2px;text-align:left}
.gtog em{flex:1 1 auto;font-style:normal;font-weight:600;color:var(--brass-ink);font-size:calc(14px * var(--fs))}
.sub.sec{margin-top:22px}

.trow2{display:flex;align-items:center;border-bottom:1px solid var(--rule-soft)}
.tlist .trow2:last-child{border-bottom:0}
.trow2 .trow{flex:1 1 auto;border-bottom:0}
.pinbtn{flex:0 0 auto;width:48px;height:48px;font-size:22px;color:var(--muted)}
.pinbtn.on{color:var(--brass-ink)}
.egwlk{color:var(--brass-ink);text-decoration:none;border-bottom:1px dotted var(--brass-ink);padding:3px 0;margin:-3px 0}
.biblk{color:var(--sage);text-decoration:none;border-bottom:1px dotted var(--sage);padding:3px 0;margin:-3px 0}
.hl{cursor:pointer;border-radius:3px}
.hl-yellow{background:rgba(255,193,7,.4)}
.hl-orange{background:rgba(255,152,0,.4)}
.hl-red{background:rgba(244,67,54,.4)}

:root[data-theme="dark"] .hl-yellow{background:rgba(255,193,7,.25)}
:root[data-theme="dark"] .hl-orange{background:rgba(255,152,0,.28)}
:root[data-theme="dark"] .hl-red{background:rgba(244,67,54,.3)}
.hl-toolbar{position:fixed;z-index:50;user-select:none;-webkit-user-select:none;background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);display:flex;gap:8px;padding:10px;max-width:280px}
.hl-toolbar button{padding:8px 12px;border-radius:8px;border:1px solid var(--rule-soft);font-size:calc(13px * var(--fs));font-weight:500;white-space:nowrap}
.hl-toolbar .hl-menu{display:flex;gap:6px;align-items:center}
.hl-color-btn{width:32px;height:32px;border-radius:6px;border:2px solid transparent;padding:0}
.hl-color-btn.hl-yellow{background:rgba(255,193,7,.6)}
.hl-color-btn.hl-orange{background:rgba(255,152,0,.6)}
.hl-color-btn.hl-red{background:rgba(244,67,54,.6)}
.hl-toolbar .hl-del{color:var(--clay);font-weight:600;border-color:var(--clay);background:var(--clay-soft)}

/* ---- 橫向時自動收起下方分頁列：往上滑（從畫面最下緣）或點小橫條叫回來，2 秒沒動作又收起 ---- */
.tabbar{transition:transform .28s ease}
.tabgrab{display:none}

  html body.hasaudio.hastab.tabhide.hasfoot main{padding-bottom:206px !important}
  html body.hasaudio.hastab.tabhide .footbar{bottom:calc(136px + env(safe-area-inset-bottom)) !important}
  html body.hastab.tabhide .audiobar{bottom:calc(8px + env(safe-area-inset-bottom)) !important}
  html body.hastab.tabhide .fab{bottom:calc(16px + env(safe-area-inset-bottom)) !important}
  body.hastab.tabhide .tabgrab{display:block;position:fixed;left:50%;transform:translateX(-50%);
    bottom:env(safe-area-inset-bottom);width:110px;height:22px;z-index:39;background:transparent;border:0;padding:0}
  body.hastab.tabhide .tabgrab::after{content:"";position:absolute;left:50%;bottom:5px;transform:translateX(-50%);
    width:56px;height:4px;border-radius:2px;background:var(--muted);opacity:.55}
}

  var u=units(text,lang), r=rng(hash(text+"|"+salt)), html="", idx=0;

  var groupLen = group ? group : (isEn(lang) ? 1 : (text.length < 26 ? 1 : 2));

    while(j<u.length && u[j].m && take<groupLen){ take++; j++; }

    out.push({p:true,s:m[0]});

  var main = '<button class="trow" style="flex:1 1 auto;border:0" data-go="#/b/' + esc(h.c) + "/" + (ref ? esc(ref) : "i" + h.i) + '"><span class="trow-main">' +
    '<span class="hit-h"><span class="pagebadge">' + esc(h.c + " " + ref) + "</span></span>" +
    '<span class="hit-s' + (z ? " z" : "") + '">' + hiSnip(txt, terms, 70) + "</span></span></button>";
  if(!pick) return main.replace('style="flex:1 1 auto;border:0"', 'style="width:100%"');
  return '<div class="trow" style="padding:0">' + main +
    '<button class="btn ' + (inL ? "btn-sage" : "btn-brass") + '" style="margin-right:12px;flex:0 0 auto" data-hitlib="' + esc(h.c) + "|" + h.i + '">' + esc(inL ? s.added : "＋") + "</button></div>";
}

/* ============ memorize list ============ */
function libId(c, i){ return c + "#" + i; }
function inLibrary(c, i){ var id = libId(c, i); for(var k = 0; k < LIB.length; k++) if(LIB[k].id === id) return true; return false; }
function toggleLib(c, i){
  var id = libId(c, i), k;
  for(k = 0; k < LIB.length; k++) if(LIB[k].id === id){ LIB.splice(k, 1); saveLib(); toast(L().libRemoved); return false; }
  var r = BK[c].rows[i];
  LIB.unshift({ id: id, c: c, i: i, ref: r[0] || "", en: stripMd(r[1]), tw: r[2] || "", cn: r[3] || "", ts: Date.now(), ok: 0, ng: 0, lt: 0 });
  saveLib(); toast(L().libAdded); return true;
}
function libItem(id){ for(var k = 0; k < LIB.length; k++) if(LIB[k].id === id) return LIB[k]; return null; }
function itemText(it){
  var zh = (P.lang === "hans" ? it.cn : it.tw) || "";
  if(P.lang === "en" || !zh) return { text: it.en.replace(/\n+/g, " ").trim(), lang: "en" };
  return { text: zh.replace(/\n+/g, "").trim(), lang: P.lang };
}
function itemTitle(it){ var m = bk(it.c); return (m ? bt(m) : it.c) + " · " + it.c + " " + it.ref; }
var LIBDEL = false, LIBDELSEL = {};
function viewLib(){
  VIEW = { name: "lib" }; PICK = false;
  var s = L();
  var head = bar('<span class="bar-title">' + esc(s.tabLib) + "</span>");
  if(!LIB.length){
    setApp(head + '<main><div class="wrap">' + fsPanel() + '<div class="libempty"><p>' + esc(s.libEmpty) + '</p><p class="sub">' + esc(s.libEmpty2) + "</p></div></div></main>" +
      '<button class="fab" data-go="#/lib/add" aria-label="' + esc(s.libAdd) + '">＋</button>', "lib");
    return;
  }
  var ok = 0, ng = 0; LIB.forEach(function(x){ ok += x.ok; ng += x.ng; });
  var rows = LIB.map(function(it){
    var tx = itemText(it), snip = tx.text.slice(0, 46) + (tx.text.length > 46 ? "…" : "");
    if(LIBDEL){
      return '<button class="trow lrow" data-libdelpick="' + esc(it.id) + '" aria-pressed="' + (!!LIBDELSEL[it.id]) + '"><span class="ck">&#10003;</span>' +
        '<span class="lmain"><span class="ltitle">' + esc(itemTitle(it)) + '</span><span class="een" style="padding:0">' + esc(snip) + "</span></span>" +
        '<span class="count">' + it.ok + "/" + (it.ok + it.ng) + "</span></button>";
    }
    return '<button class="trow lrow" data-go="#/lib/d/' + esc(it.id) + '"><span class="lmain"><span class="ltitle">' + esc(itemTitle(it)) + "</span>" +
      '<span class="een" style="padding:0">' + esc(snip) + "</span></span>" + '<span class="count">' + it.ok + "/" + (it.ok + it.ng) + "</span></button>";
  }).join("");
  var delN = 0; for(var kk in LIBDELSEL) if(LIBDELSEL[kk]) delN++;
  setApp(head + '<main><div class="wrap">' + fsPanel() +
    '<div class="src" style="margin:0 0 14px;font-family:var(--f-mono);font-size:calc(11.5px * var(--fs));color:var(--faint)">' + esc(t(s.libCount, LIB.length, ok, ng)) + "</div>" +
    '<div class="tlist">' + rows + "</div>" +
    '<button class="clearbtn" style="margin-top:18px" data-libdeltoggle="1">' + esc(LIBDEL ? (delN ? t(s.libDelN, delN) : s.libDelDone) : s.libDelToggle) + "</button></div></main>" +
    (LIBDEL ? "" : '<button class="fab" data-go="#/lib/add" aria-label="' + esc(s.libAdd) + '">＋</button>'), "lib");
}

/* ---- drill (practice one passage) ---- */
var D = null;
function viewDrill(id){
  var it = libItem(id); if(!it){ return go("#/lib"); }
  if(!D || D.id !== id) D = { id: id, level: "fill", revealed: false, shown: {}, salt: 0 };
  VIEW = { name: "drill", id: id };
  var s = L(), tx = itemText(it), lang = tx.lang, text = tx.text;
  var nCl = (D.level === "fill") ? 0 : clauseCount(text, lang);
  var nOn = 0; Object.keys(D.shown || {}).forEach(function(k){ if(D.shown[k]) nOn++; });
  var allOn = D.revealed || (D.level !== "fill" && nCl > 0 && nOn >= nCl);
  var body;
  if(allOn) body = esc(text);
  else if(D.level === "fill") body = maskUnits(text, lang, .38, D.salt + "|" + id, D.shown);
  else body = segMask(text, lang, D.level, D.shown);
  var lvSeg = '<div class="seg" role="group" style="margin-bottom:16px;width:100%">' +
    [["fill", s.lv.fill], ["hint", s.lv.hint], ["blank", s.lv.blank]].map(function(p){
      return '<button data-vlv="' + p[0] + '" aria-pressed="' + (D.level === p[0]) + '" style="flex:1">' + esc(p[1]) + "</button>"; }).join("") + "</div>";
  var idx = LIB.indexOf(it), hasNext = idx + 1 < LIB.length;
  var html = bar(backBtn("#/lib") + '<span class="bar-title">' + esc(it.c + " " + it.ref) + "</span>") +
    '<main><div class="wrap">' + fsPanel() + lvSeg +
    '<div class="qmeta"><span class="n">' + esc(itemTitle(it)) + '</span><span class="n">' + esc(t(s.scoreline, it.ok, it.ng)) + "</span></div>" +
    '<div class="card"><div class="vbody' + (lang === "en" ? " en" : "") + '" id="vbody">' + body + "</div>" +
    (allOn ? "" : '<div class="stat"><div>' + esc(s.vlvDesc[D.level]) + "</div></div>") + "</div>" +
    '<div class="actions drill" style="margin-top:14px">' +
    (allOn ? "" : '<button class="btn btn-p btn-wide" data-vreveal="1">' + esc(s.showAll) + "</button>") +
    '<button class="btn btn-wide" data-reshuffle="1">' + esc(s.reshuffle) + "</button>" +
    '<button class="btn btn-wide" data-go="#/b/' + esc(it.c) + "/" + (it.ref ? esc(it.ref) : "i" + it.i) + '">' + esc(s.openInBook) + "</button>" +
    (hasNext ? '<button class="btn btn-wide" data-nextd="1">' + esc(s.nextItem) + "</button>" : "") + "</div></div></main>" +
    '<div class="footbar"><div class="wrap"><button class="btn btn-clay btn-wide" data-vmark="0">' + esc(s.forgot) + '</button><button class="btn btn-sage btn-wide" data-vmark="1">' + esc(s.got) + "</button></div></div>";
  setApp(html, "lib", true);
}
function markItem(good){
  var it = libItem(D.id); if(!it) return;
  if(good) it.ok++; else it.ng++;
  it.lt = Date.now(); saveLib();
  var idx = LIB.indexOf(it);
  D = null;
  if(idx + 1 < LIB.length) go("#/lib/d/" + LIB[idx + 1].id); else { toast(L().allDone); go("#/lib"); }
}

var DLTOKEN = 0;
function downloadAll(filter){
  var s = L(), list = CAT.filter(function(b){ return !filter || filter(b); });
  var tok = ++DLTOKEN, done = 0, fail = 0, pr = $("dlprog"), bar2 = $("dlbar"), info = $("dlinfo");
  pr.style.display = "block";
  function next(){
    if(tok !== DLTOKEN) return;
    if(done + fail >= list.length){ info.textContent = t(s.dlDone, done) + (fail ? t(s.dlFail, fail) : ""); return; }
    var b = list[done + fail];
    info.textContent = t(s.dlIng, done + fail + 1, list.length, b.c);
    fetch("data/b/" + b.c + ".json?v=" + DV).then(function(r){ if(!r.ok) throw 0; return r.blob(); })
      .then(function(){ done++; bar2.style.width = Math.round((done + fail) / list.length * 100) + "%"; next(); })
      .catch(function(){ fail++; next(); });
  }
  next();
}

/* ============ events ============ */
document.addEventListener("click", function(e){
  var tg = e.target, el;
  if((el = tg.closest("[data-go]"))){ e.preventDefault(); if(VIEW && VIEW.name === "home") HOMEY = window.scrollY; else if(VIEW && (VIEW.name === "search" || VIEW.name === "toc")) SEARCHY[location.hash] = window.scrollY; go(el.getAttribute("data-go")); return; }
  if((el = tg.closest("[data-sgo]"))){ go(el.getAttribute("data-sgo")); return; }
  if((el = tg.closest("[data-fs]"))){
    var d = el.getAttribute("data-fs");
    if(d === "toggle") FSOPEN = !FSOPEN;
    else if(d === "up" && P.fs < FS.length - 1) P.fs++;
    else if(d === "down" && P.fs > 0) P.fs--;
    else if(d === "reset") P.fs = 1;
    saveSet(); rerender(); return;
  }
  if((el = tg.closest("[data-gtog]"))){ var gk = el.getAttribute("data-gtog"); HOMEEXP[gk] = !HOMEEXP[gk]; lsSet("egw.exp", HOMEEXP); var bl2 = $("blist"); if(bl2) bl2.innerHTML = bookListHTML(HOMEQ.trim()); return; }
  if((el = tg.closest("[data-pinedit]"))){ HOMEEDIT = !HOMEEDIT; var bl3 = $("blist"); if(bl3) bl3.innerHTML = bookListHTML(HOMEQ.trim()); return; }
  if((el = tg.closest("[data-pin]"))){ togglePin(el.getAttribute("data-pin")); var bl4 = $("blist"); if(bl4) bl4.innerHTML = bookListHTML(HOMEQ.trim()); var pb = $("pinbtn"); if(pb) refreshPinBtn(); return; }
  if((el = tg.closest("[data-pinbook]"))){ togglePin(el.getAttribute("data-pinbook")); refreshPinBtn(); return; }
  if((el = tg.closest("[data-mtog]"))){ var mk = el.getAttribute("data-mtog"); TOCEXP[mk] = !TOCEXP[mk]; var tl = $("tocl"); if(tl && TOCCTX) tl.innerHTML = tocListHTML(TOCCTX.meta, TOCCTX.b); return; }
  if((el = tg.closest("[data-lang]"))){ P.lang = el.getAttribute("data-lang"); if(D){ D.shown = {}; D.revealed = false; } saveSet(); rerender(); return; }
  if((el = tg.closest("[data-sv]"))){
    var k = el.parentNode.getAttribute("data-skey"); P[k] = el.getAttribute("data-sv") === "true"; saveSet(); rerender(); return;
  }
  if((el = tg.closest("[data-setv]"))){
    var k2 = el.parentNode.getAttribute("data-key"); P[k2] = el.getAttribute("data-setv"); saveSet();
    el.parentNode.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-pressed", String(x === el)); }); return;
  }
  if((el = tg.closest("[data-act]"))){ paraAct(el.getAttribute("data-act")); return; }
  if((el = tg.closest("[data-bib]"))){
    var bv = el.getAttribute("data-bib");
    if(window.parent && window.parent !== window){ try{ window.parent.postMessage({ t: "egw-bible", go: bv }, location.origin); return; }catch(e){} }
    window.open(STUDY_URL + "#go=bible/" + bv, "_blank", "noopener"); return;
  }
  if((el = tg.closest("[data-delbm]"))){ BM.splice(+el.getAttribute("data-delbm"), 1); lsSet("egw.bm", BM); viewBookmarks(); return; }
  if((el = tg.closest("[data-pickbooks]"))){ PICK = true; go("#/"); return; }
  if((el = tg.closest("[data-hitlib]"))){
    var pr = el.getAttribute("data-hitlib").split("|"), c = pr[0], i = +pr[1];
    loadBook(c).then(function(){ toggleLib(c, i); el.className = "btn " + (inLibrary(c, i) ? "btn-sage" : "btn-brass"); el.textContent = inLibrary(c, i) ? L().added : "＋"; });
    return;
  }
  if((el = tg.closest("[data-exp]"))){ var ec = el.getAttribute("data-exp"); HIT.exp[ec] = !HIT.exp[ec]; renderHits(HIT.all, HIT.terms, HIT.cjk, HIT.pick); return; }
  if(tg.id === "more"){ HIT.n += 20; renderHits(HIT.all, HIT.terms, HIT.cjk, HIT.pick); return; }
  /* memorize list */
  if((el = tg.closest("[data-libdeltoggle]"))){
    if(!LIBDEL){ LIBDEL = true; LIBDELSEL = {}; }
    else {
      var ids = Object.keys(LIBDELSEL).filter(function(x){ return LIBDELSEL[x]; });
      if(ids.length){ LIB = LIB.filter(function(x){ return ids.indexOf(x.id) < 0; }); saveLib(); }
      LIBDEL = false; LIBDELSEL = {};
    }
    viewLib(); return;
  }
  if((el = tg.closest("[data-libdelpick]"))){
    var id = el.getAttribute("data-libdelpick"); LIBDELSEL[id] = !LIBDELSEL[id]; viewLib(); return;
  }
  /* drill */
  if((el = tg.closest("[data-vlv]"))){ D.level = el.getAttribute("data-vlv"); D.revealed = false; D.shown = {}; viewDrill(D.id); return; }
  if(tg.closest("[data-vreveal]")){ D.revealed = true; viewDrill(D.id); return; }
  if(tg.closest("[data-reshuffle]")){ D.salt++; D.shown = {}; D.revealed = false; viewDrill(D.id); return; }
  if((el = tg.closest("[data-vmark]"))){ markItem(el.getAttribute("data-vmark") === "1"); return; }
  if(tg.closest("[data-nextd]")){ var it = libItem(D.id), ix = LIB.indexOf(it); D = null; if(ix + 1 < LIB.length) go("#/lib/d/" + LIB[ix + 1].id); return; }
  if((el = tg.closest(".blk")) && D){ var bi = el.getAttribute("data-b"); D.shown[bi] = !D.shown[bi]; el.classList.toggle("on", !!D.shown[bi]); return; }
  if((el = tg.closest(".sblk")) && D){
    var si = el.getAttribute("data-s"); D.shown[si] = true; viewDrill(D.id); return;
  }
  /* reader paragraph */
  if(HLBAR && !tg.closest(".hl-toolbar")) hlDrop();
  if(VIEW && VIEW.name === "reader" && (el = tg.closest(".hl[data-hl]")) && !(window.getSelection && window.getSelection().toString())){ hlEdit(el); return; }
  var p = tg.closest(".para");
  if(p && VIEW && VIEW.name === "reader" && !tg.closest("a")){
    var sel = window.getSelection && window.getSelection().toString();
    if(sel) return;
    var pi = +p.getAttribute("data-i");
    if(SEL && SEL.i === pi) closeSheet(); else openSheet(pi);
    return;
  }
  if(!tg.closest("#sheet")) closeSheet();
});

/* ---- 橫向時自動收起下方分頁列 ----
   手機橫放時分頁列自動滑下去、讓內文多一點空間；從螢幕最下緣往上滑（或點底部的小橫條）
   分頁列滑回來，2 秒沒有碰它就又收起來。 */
(function(){
  var mq = window.matchMedia("(orientation: landscape) and (max-height: 520px)");
  var timer = null, pressing = false, sy = null;
  var cl = document.body.classList;
  function hide(){ if(!pressing) cl.toggle("tabhide", mq.matches); }
  function arm(){ clearTimeout(timer); timer = setTimeout(hide, 2000); }
  function show(){ cl.remove("tabhide"); arm(); }
  function sync(){ clearTimeout(timer); cl.toggle("tabhide", mq.matches); }
  var grab = document.createElement("button");
  grab.className = "tabgrab"; grab.setAttribute("aria-label", "show tabs");
  grab.addEventListener("click", function(e){ e.preventDefault(); e.stopPropagation(); show(); });
  document.body.appendChild(grab);
  if(mq.addEventListener) mq.addEventListener("change", sync); else if(mq.addListener) mq.addListener(sync);
  window.addEventListener("orientationchange", function(){ setTimeout(sync, 250); });
  document.addEventListener("touchstart", function(e){
    var t = e.touches[0];
    if(e.target.closest && e.target.closest(".tabbar")){ pressing = true; clearTimeout(timer); }
    sy = (mq.matches && cl.contains("tabhide") && t && t.clientY > window.innerHeight - 90) ? t.clientY : null;
  }, {passive:true});
  document.addEventListener("touchmove", function(e){
    if(sy === null) return;
    var t = e.touches[0];
    if(t && sy - t.clientY > 16){ sy = null; show(); }
  }, {passive:true});
  function release(){ if(pressing){ pressing = false; if(!cl.contains("tabhide")) arm(); } sy = null; }
  document.addEventListener("touchend", release, {passive:true});
  document.addEventListener("touchcancel", release, {passive:true});
  document.addEventListener("click", function(e){
    if(e.target.closest && e.target.closest(".tabbar") && !cl.contains("tabhide")) arm();
  });
  sync();
})();
boot();
